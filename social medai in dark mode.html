<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weirdxact Social Links</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:url" content="https://www.weirdxact.com/" />
  <meta property="og:title" content="Weirdxact Social Media" />
  <meta property="og:description" content="Connect with Weirdxact on Instagram, Facebook, YouTube, Spotify, X, and Discord." />
  <style>
  :root {
    --dark-bg: url('https://i.pinimg.com/1200x/9e/c0/92/9ec092d0a6dada6f6a2b9cfaaec06ccd.jpg');
    --light-bg: url('https://i.pinimg.com/1200x/c9/68/0e/c9680e608854a23b9acd2246e7830ee7.jpg');
    --custom-bg: none;
  }

  body {
    background-image: var(--custom-bg, var(--dark-bg));
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center center;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .lightning-title {
    font-size: 4rem;
    font-weight: bold;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 48px;
    color: #fff;
    text-shadow:
      0 0 16px #fff,
      0 0 32px #00f0ff,
      0 0 48px #00e8ff,
      0 0 64px #00d5ff;
    animation: lightning-flicker 1.6s infinite;
  }

  @keyframes lightning-flicker {
    0%, 100% { opacity: 1; text-shadow:
      0 0 16px #fff,
      0 0 32px #00f0ff,
      0 0 48px #00e8ff,
      0 0 64px #00d5ff; }
    2% { opacity: 0.7; text-shadow:
      0 0 8px #fff,
      0 0 16px #00f0ff,
      0 0 24px #00e8ff,
      0 0 32px #00d5ff; }
    4% { opacity: 1; }
    8% { opacity: 0.6; text-shadow:
      0 0 4px #fff,
      0 0 8px #00f0ff,
      0 0 12px #00e8ff,
      0 0 16px #00d5ff; }
    10% { opacity: 1; }
    12% { opacity: 0.8; }
    14% { opacity: 1; }
    16% { opacity: 0.5; }
    18% { opacity: 1; }
    20% { opacity: 0.9; }
    22% { opacity: 1; }
    24% { opacity: 0.8; }
    26% { opacity: 1; }
    28% { opacity: 0.7; }
    30% { opacity: 1; }
    32% { opacity: 0.9; }
    34% { opacity: 1; }
    36% { opacity: 0.8; }
    38% { opacity: 1; }
    40%, 99% { opacity: 1; }
  }

  .main-container {
    display: flex;
    gap: 40px;
  }

  .box {
    background: #23232b;
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.22);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 140px;
    height: 140px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .box:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 36px rgba(0,0,0,0.28);
  }

  .box.instagram:hover { background: #E4405F; }
  .box.facebook:hover { background: #1877F3; }
  .box.youtube:hover { background: #FF0000; }
  .box.discord:hover { background: #5865F2; }
  .box.spotify:hover { background: #1ED760; }
  .box.x:hover { background: #000000; }

  .box.instagram:hover .icon,
  .box.facebook:hover .icon,
  .box.youtube:hover .icon,
  .box.discord:hover .icon,
  .box.spotify:hover .icon,
  .box.x:hover .icon {
    color: #fff;
  }

  .icon {
    font-size: 48px;
    margin-bottom: 15px;
    color: #ffffff;
    transition: color 0.2s;
  }

  .label {
    font-size: 19px;
    font-weight: 600;
    color: #f3f3f6;
    letter-spacing: 0.5px;
  }

  body.light-mode {
    background-image: var(--custom-bg, var(--light-bg));
    color: #14141d;
  }

  body.light-mode .lightning-title {
    color: #000000;
    text-shadow:
      0 0 16px #000,
      0 0 32px #d45555,
      0 0 48px #fa0000,
      0 0 64px #bb2904;
  }

  body.light-mode .box {
    background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,0.11);
  }

  body.light-mode .label {
    color: #23232b;
  }

  body.light-mode .box.instagram:hover { background: #E4405F; }
  body.light-mode .box.facebook:hover { background: #1877F3; }
  body.light-mode .box.youtube:hover { background: #FF0000; }
  body.light-mode .box.discord:hover { background: #5865F2; }
  body.light-mode .box.spotify:hover { background: #1ED760; }
  body.light-mode .box.x:hover { background: #000000; }

  body.light-mode .box .icon {
    color: #292937;
  }

  body.light-mode .box.instagram:hover .icon,
  body.light-mode .box.facebook:hover .icon,
  body.light-mode .box.youtube:hover .icon,
  body.light-mode .box.discord:hover .icon,
  body.light-mode .box.spotify:hover .icon,
  body.light-mode .box.x:hover .icon {
    color: #fff;
  }

  .wallpaper-customizer {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 1000;
    background: rgba(18, 18, 25, 0.88);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 12px 14px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 180px;
  }

  .wallpaper-customizer label {
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .wallpaper-customizer select,
  .wallpaper-customizer input[type="file"],
  .wallpaper-customizer button {
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }

  .wallpaper-customizer select,
  .wallpaper-customizer input[type="file"] {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.12);
  }

  .wallpaper-customizer button {
    background: linear-gradient(135deg, #00f0ff, #6ad7ff);
    color: #111827;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .wallpaper-customizer button:hover {
    transform: translateY(-1px);
  }

  body.light-mode .wallpaper-customizer {
    background: rgba(255,255,255,0.9);
    border-color: rgba(0,0,0,0.08);
  }

  body.light-mode .wallpaper-customizer label {
    color: #222;
  }

  body.light-mode .wallpaper-customizer select,
  body.light-mode .wallpaper-customizer input[type="file"] {
    background: #f3f4f6;
    color: #111827;
    border-color: rgba(0,0,0,0.08);
  }

  .toggle-theme-btn {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 1000;
    background: #23232b;
    color: #fff;
    border: none;
    border-radius: 50%;
    box-shadow: 0 4px 18px rgba(0,0,0,0.22);
    width: 56px;
    height: 56px;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }

  .toggle-theme-btn:hover {
    background: #00f0ff;
    color: #23232b;
    box-shadow: 0 8px 32px rgba(0,0,0,0.28);
  }

  body.light-mode .toggle-theme-btn {
    background: #fff;
    color: #23232b;
  }

  body.light-mode .toggle-theme-btn:hover {
    background: #00b3d5;
    color: #fff;
  }

  @media (max-width: 800px) {
    .lightning-title { font-size: 2.4rem; margin-bottom: 24px; }
    .main-container { flex-wrap: wrap; justify-content: center; gap: 24px; }
    .box { width: 38vw; min-width: 120px; height: 100px; }
    .icon { font-size: 36px; margin-bottom: 10px; }
    .label { font-size: 17px; }
    .toggle-theme-btn { width: 44px; height: 44px; font-size: 20px; right: 14px; bottom: 14px; }
    .wallpaper-customizer {
      left: 12px;
      bottom: 12px;
      min-width: 160px;
    }
  }

  @media (max-width: 500px) {
    .lightning-title { font-size: 1.4rem; margin-bottom: 16px; }
    .main-container { flex-direction: column; gap: 20px; }
    .box { width: 86vw; }
    .toggle-theme-btn { width: 38px; height: 38px; font-size: 16px; right: 10px; bottom: 10px; }
    .wallpaper-customizer {
      left: 8px;
      bottom: 58px;
      right: 8px;
      min-width: unset;
    }
  }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <div class="lightning-title">𝐖𝐄𝐈𝐑𝐃𝐗𝐀𝐂𝐓</div>

  <div class="main-container">
    <a class="box instagram" href="https://www.instagram.com/weirdxact" target="_blank" rel="noopener" aria-label="Instagram">
      <span class="icon"><i class="fab fa-instagram"></i></span>
      <span class="label">Instagram</span>
    </a>
    <a class="box facebook" href="https://www.facebook.com/mbarek.amrani.58" target="_blank" rel="noopener" aria-label="Facebook">
      <span class="icon"><i class="fab fa-facebook"></i></span>
      <span class="label">Facebook</span>
    </a>
    <a class="box youtube" href="https://www.youtube.com/@weirdxact" target="_blank" rel="noopener" aria-label="YouTube">
      <span class="icon"><i class="fab fa-youtube"></i></span>
      <span class="label">YouTube</span>
    </a>
    <a class="box discord" href="https://discord.gg/PE6Ytg4Q" target="_blank" rel="noopener" aria-label="Discord">
      <span class="icon"><i class="fab fa-discord"></i></span>
      <span class="label">Discord</span>
    </a>
    <a class="box spotify" href="https://open.spotify.com/playlist/1DncPiEriy0rFIZD2PGQOL?si=fd0747e3bed14c28&nd=1&dlsi=8438b6927875433c" target="_blank" rel="noopener" aria-label="Spotify">
      <span class="icon"><i class="fab fa-spotify"></i></span>
      <span class="label">Spotify</span>
    </a>
    <a class="box x" href="https://x.com/Weirdexact" target="_blank" rel="noopener" aria-label="X">
      <span class="icon"><i class="fab fa-x-twitter"></i></span>
      <span class="label">X</span>
    </a>
  </div>

  <div class="wallpaper-customizer" aria-label="Wallpaper customizer">
    <label for="bgPreset">Wallpaper</label>
    <select id="bgPreset">
      <option value="dark">Dark Neon</option>
      <option value="light">Light Sunset</option>
      <option value="galaxy">Galaxy</option>
      <option value="custom">Custom</option>
    </select>

    <label for="backgroundUpload">Upload photo</label>
    <input id="backgroundUpload" type="file" accept="image/*">

    <button type="button" id="resetBackground">Reset</button>
  </div>

  <button class="toggle-theme-btn" title="Toggle dark/light mode" aria-label="Toggle dark/light mode">
    <i class="fas fa-moon"></i>
  </button>

  <script>
    const btn = document.querySelector('.toggle-theme-btn');
    const body = document.body;
    const bgPreset = document.getElementById('bgPreset');
    const backgroundUpload = document.getElementById('backgroundUpload');
    const resetBackgroundBtn = document.getElementById('resetBackground');

    const presets = {
      dark: 'https://i.pinimg.com/1200x/9e/c0/92/9ec092d0a6dada6f6a2b9cfaaec06ccd.jpg',
      light: 'https://i.pinimg.com/1200x/c9/68/0e/c9680e608854a23b9acd2246e7830ee7.jpg',
      galaxy: 'https://images.unsplash.com/photo-1465101046530-73398c7f28ca?auto=format&fit=crop&w=1600&q=80'
    };

    let isLight = false;

    function applyBackgroundImage(url) {
      if (url) {
        body.style.setProperty('--custom-bg', `url("${url}")`);
      } else {
        body.style.removeProperty('--custom-bg');
      }
    }

    function setTheme(light) {
      isLight = light;
      if (light) {
        body.classList.add('light-mode');
        btn.innerHTML = '<i class="fas fa-sun"></i>';
      } else {
        body.classList.remove('light-mode');
        btn.innerHTML = '<i class="fas fa-moon"></i>';
      }

      const customBg = localStorage.getItem('customBackground');
      if (!customBg) {
        const bgKey = light ? 'light' : 'dark';
        applyBackgroundImage(presets[bgKey]);
      }

      localStorage.setItem('theme', light ? 'light' : 'dark');
    }

    function loadTheme() {
      const theme = localStorage.getItem('theme');
      const savedCustomBackground = localStorage.getItem('customBackground');

      if (savedCustomBackground) {
        applyBackgroundImage(savedCustomBackground);
        bgPreset.value = 'custom';
      } else {
        const initialTheme = theme === 'light' ? 'light' : 'dark';
        bgPreset.value = initialTheme;
        applyBackgroundImage(presets[initialTheme]);
      }

      setTheme(theme === 'light');
    }

    bgPreset.addEventListener('change', (event) => {
      const value = event.target.value;

      if (value === 'custom') {
        backgroundUpload.click();
        return;
      }

      localStorage.removeItem('customBackground');
      applyBackgroundImage(presets[value]);
    });

    backgroundUpload.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const imageUrl = e.target.result;
        localStorage.setItem('customBackground', imageUrl);
        applyBackgroundImage(imageUrl);
        bgPreset.value = 'custom';
      };
      reader.readAsDataURL(file);
    });

    resetBackgroundBtn.addEventListener('click', () => {
      localStorage.removeItem('customBackground');
      backgroundUpload.value = '';
      const themeKey = isLight ? 'light' : 'dark';
      bgPreset.value = themeKey;
      applyBackgroundImage(presets[themeKey]);
    });

    btn.addEventListener('click', () => {
      const nextTheme = !isLight;
      setTheme(nextTheme);
      if (!localStorage.getItem('customBackground')) {
        bgPreset.value = nextTheme ? 'light' : 'dark';
      }
    });

    loadTheme();
  </script>
</body>
</html>
